version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      oxc:
        patterns: ["oxlint", "oxlint-tsgolint", "oxfmt", "oxc-parser"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
